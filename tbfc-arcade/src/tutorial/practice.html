<!-- Menu structure is deliberately separate from navigation and save handling. -->
<template id="practice">
  <div class="practice-shell ft-practice-shell">
    <h1 data-title>Practice</h1>
    <p data-description></p>
    <nav class="ft-practice-choices" aria-label="Practice choices"></nav>
    <div class="picker-hints menu-legend" data-menu-hints>
      <span><span data-glyph="Enter|A"></span> Select</span>
      <button class="ft-plain-control" data-menu-back tabindex="-1">
        <span data-glyph="Esc|B"></span> Back
      </button>
    </div>
  </div>
</template>
<template id="practice-chapter">
  <div class="ft-chapter-preview" aria-hidden="true" data-preview></div>
  <p class="ft-chapter-description" data-chapter-description></p>
  <div class="ft-chapter-controls">
    <button class="ft-plain-control" data-story>
      <span data-glyph="Enter|A"></span> Start Story Here
    </button>
    <button class="ft-plain-control" data-back tabindex="-1">
      <span data-glyph="Esc|B"></span> Back
    </button>
  </div>
</template>
<template id="chapter-choice">
  <button class="ft-chapter-card" data-chapter>
    <span class="ft-chapter-scene" aria-hidden="true" data-scene></span>
    <span class="ft-chapter-caption"
      ><small data-number></small><strong data-chapter-title></strong
    ></span>
  </button>
</template>

<template id="free-practice-roster">
  <div class="practice-shell">
    <h1>Free Practice</h1>
    <p>Choose up to seven Turf Burners</p>
    <div class="practice-grid roster" aria-label="Choose players"></div>
    <div class="picker-hints menu-legend">
      <span><span data-glyph="Space|A"></span> Select / Deselect</span>
      <button data-back><span data-glyph="Esc|B"></span> Back</button>
      <button data-play>
        <span data-glyph="Enter|Menu"></span> Take the Field
      </button>
    </div>
  </div>
</template>
<template id="free-practice-player">
  <button aria-pressed="false">
    <i aria-hidden="true"></i><span data-player-name></span>
  </button>
</template>
