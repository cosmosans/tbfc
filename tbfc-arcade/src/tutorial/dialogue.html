<!-- FIRST TOUCH presentation. Edit these templates without touching game logic. -->
<template id="lesson">
  <aside class="ft-lesson">
    <small data-location>CANDLER PARK · ATLANTA</small>
    <strong data-title></strong>
    <p data-prompt></p>
    <small data-demonstrated hidden><svg class="ft-check" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8l4 4 8-8" /></svg> Skill Demonstrated</small>
    <small data-storage hidden>Progress cannot be saved in this browser session.</small>
    <button data-options><span data-glyph="Esc|Menu"></span> Tutorial options</button>
    <button data-next><span data-glyph="N|RB"></span> <span data-next-label>Continue when ready</span></button>
  </aside>
</template>
<template id="dialogue">
  <section class="ft-dialogue" aria-label="Teammate conversation">
    <div class="ft-portrait" data-portrait></div>
    <div>
      <strong data-speaker></strong>
      <p data-line></p>
      <button data-continue><span data-glyph="J / Enter|A"></span> <span data-continue-label>Continue</span></button>
      <button data-dismiss><span data-glyph="K|B"></span> Dismiss</button>
    </div>
  </section>
</template>
<template id="options">
  <section class="ft-options" aria-label="Tutorial options">
    <h2>FIRST TOUCH · PAUSED</h2>
    <button data-resume>Return to the field</button>
    <button data-advance>Next chapter / finish</button>
    <button data-hint>Coaching hint</button>
    <button data-reset>Reset Ball</button>
    <button data-toggle-chapters>Show / hide chapters</button>
    <nav data-chapters aria-label="Chapters" hidden></nav>
    <button data-exit>Return to Practice</button>
  </section>
</template>
<template id="completion">
  <section class="ft-completion" role="dialog" aria-modal="true" aria-labelledby="ft-completion-title">
    <img class="ft-completion-crest" data-crest alt="Turf Burners FC crest">
    <small>CANDLER PARK · ATLANTA</small>
    <h1 id="ft-completion-title">FIRST TOUCH COMPLETE</h1>
    <p>WELCOME TO TURF BURNERS FC</p>
    <button data-exit><span data-glyph="Enter|A"></span> Continue</button>
  </section>
</template>

<!-- A short instruction and its input badge wrap as one unit. -->
<template id="instruction"><span class="ft-instruction" data-instruction></span></template>
