<div class="ts-foot menu-legend controller-legend" aria-label="Team selection controls">
  <button class="ts-back" aria-label="Back (Escape or controller B)">{{backHint}} Back</button>
  <span>{{clubHint}} ↕ Club</span>
  <span>{{sideHint}} ↔ Side</span>
  <span>{{kitHint}} Swap Kit</span>
  <button class="ts-next" aria-label="Continue (Enter or controller A)">{{continueHint}} Continue</button>
</div>
