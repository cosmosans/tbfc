<!-- Controller-first legend; data-back keeps mouse and keyboard activation working. -->
<div class="menu-legend controller-legend ko-mode-legend" aria-label="Menu controls">
  <span>{{moveHint}} Move</span>
  <span>{{selectHint}} Select</span>
  <button data-back aria-label="Back (Escape or controller B)">{{backHint}} Back</button>
</div>
