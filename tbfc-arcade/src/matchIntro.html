<!-- The game fills the two crests and match details from the selected fixture. -->
<section class="match-intro" aria-label="Match introduction">
  <div class="mi-card">
    <div class="mi-clubs">
      <img data-home alt="" />
      <strong class="mi-versus">VS</strong>
      <img data-away alt="" />
    </div>

    <div class="mi-details" style="min-width: 300px; padding-top: 15px">
      <div class="mi-details-rotate">
        <div style="font-size: 28px; font-family: Upheaval">
          <span data-season></span>
        </div>
        <div style="font-size: 28px; font-family: Upheaval">
          <span data-kind></span>
        </div>

        <div style="padding-top: 10px; font-size: 16px; padding-bottom: 10px">
          <span data-venue></span> • <span data-time></span>
        </div>
      </div>
    </div>
  </div>

  <button
    style="background-color: transparent; border: none"
    type="button"
    data-start
  >
    <kbd class="key-hint">J</kbd>
    <kbd class="pad-hint" data-pad="A" aria-label="A">A</kbd>
    Start Match
  </button>
</section>
